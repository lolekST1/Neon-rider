<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>slider — neon rider</title>
<style>
  :root { --neon: #b14bff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0420;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    touch-action: none; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  #game { display: block; width: 100vw; height: 100vh; cursor: pointer; }

  /* ---------- HUD ---------- */
  .overlay { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hud { position: fixed; top: 0; left: 0; right: 0; z-index: 12;
         display: flex; align-items: flex-start; justify-content: space-between;
         padding: 18px 22px; pointer-events: none; }

  .menu-btn {
    pointer-events: auto; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; color: #fff; font-weight: 700;
    font-size: 12px; letter-spacing: 1px; line-height: 1;
  }
  .menu-btn .arrow {
    width: 46px; height: 34px; border-radius: 8px;
    background: #ffd400; display: flex; align-items: center; justify-content: center;
    color: #201500; font-size: 22px; font-weight: 900;
    box-shadow: 0 0 16px rgba(255,212,0,.55);
    transition: transform .08s ease;
  }
  .menu-btn:active .arrow { transform: scale(.9); }
  .menu-btn span { text-shadow: 0 0 6px rgba(0,0,0,.6); }

  .title-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; margin-top: 2px; }
  .title {
    font-family: "Courier New", monospace; font-weight: 900;
    font-size: 30px; letter-spacing: 8px; text-transform: lowercase;
    transition: color .5s ease, text-shadow .5s ease;
  }
  .score {
    font-family: "Trebuchet MS", sans-serif; font-weight: 900;
    font-size: 46px; color: #fff; line-height: 1; margin-top: 4px;
    text-shadow: 0 0 18px rgba(255,255,255,.35);
  }

  .powers { display:flex; gap:10px; margin-top:6px; min-height:22px;
    font-weight:800; font-size:15px; color:#fff; justify-content:center; }
  .powers span { display:inline-flex; align-items:center; gap:4px; padding:2px 9px;
    border-radius:11px; background:rgba(255,255,255,.09);
    text-shadow:0 0 8px currentColor; }

  .diamonds {
    display: flex; align-items: center; gap: 8px;
    color: #fff; font-weight: 900; font-size: 30px;
    text-shadow: 0 0 12px rgba(255,255,255,.4);
  }
  .diamonds .gem {
    width: 20px; height: 28px;
    background: linear-gradient(180deg,#fff,#bfe9ff);
    clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%);
    box-shadow: 0 0 14px rgba(180,230,255,.9);
  }

  .version {
    position: fixed; right: 12px; bottom: 9px; z-index: 15;
    font-family: "Courier New", monospace; font-size: 13px; font-weight: 700;
    letter-spacing: 1px; color: rgba(255,255,255,.55);
    text-shadow: 0 0 8px rgba(255,255,255,.4); pointer-events: none;
  }

  /* ---------- Screens ---------- */
  .screen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(30,10,60,.35), rgba(6,2,20,.82));
    backdrop-filter: blur(2px);
  }
  .hidden { display: none !important; }

  .panel {
    text-align: center; padding: 40px 46px; border-radius: 22px;
    background: rgba(20,8,44,.72);
    border: 2px solid var(--neon);
    box-shadow: 0 0 34px var(--neon), inset 0 0 26px rgba(177,75,255,.28);
    max-width: 90vw;
  }
  .panel .big {
    font-family: "Courier New", monospace; font-weight: 900;
    letter-spacing: 10px; text-transform: lowercase;
    font-size: clamp(40px, 9vw, 78px);
    color: #fff; text-shadow: 0 0 22px var(--neon), 0 0 44px var(--neon);
    margin-bottom: 6px;
  }
  .panel .gameover {
    font-family: "Trebuchet MS", sans-serif; letter-spacing: 6px;
    font-size: clamp(34px, 7vw, 60px); font-weight: 900; color: #fff;
    text-shadow: 0 0 20px var(--neon), 0 0 40px var(--neon);
  }
  .panel .sub { color: #d9c4ff; letter-spacing: 3px; font-weight: 700;
    font-size: clamp(12px, 2.6vw, 16px); margin: 10px 0 6px; }
  .panel .stats { color: #b79be6; font-size: 15px; margin: 14px 0 26px; line-height: 1.7; }
  .panel .stats b { color: #fff; }
  .panel .hint { color: #9c86cf; font-size: 13px; letter-spacing: 1px; margin-top: 20px; }

  .btn-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn {
    pointer-events: auto; cursor: pointer;
    border: 2px solid var(--neon); background: rgba(177,75,255,.12);
    color: #fff; font-weight: 900; letter-spacing: 2px; font-size: 16px;
    padding: 14px 26px; border-radius: 12px;
    box-shadow: 0 0 16px rgba(177,75,255,.4);
    transition: transform .08s ease, background .15s ease, box-shadow .15s ease;
  }
  .btn:hover { background: rgba(177,75,255,.28); box-shadow: 0 0 26px var(--neon); }
  .btn:active { transform: scale(.94); }
  .btn.primary { background: var(--neon); color: #150826;
    box-shadow: 0 0 26px var(--neon); }
  .btn.primary:hover { background: #c76dff; }

  .missions { margin-top: 18px; font-size: 13px; color: #c9b4f0;
    line-height: 1.9; letter-spacing: .4px; }
  .missions b { color: #fff; letter-spacing: 2px; }
  .missions .mdone { color: #5cff8f; }

  .skin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-top: 8px; }
  .skin { cursor: pointer; padding: 12px 8px 9px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05);
    transition: transform .08s ease, border-color .15s ease; }
  .skin:hover { transform: scale(1.04); }
  .skin.active { border-color: #fff; box-shadow: 0 0 14px rgba(255,255,255,.35); }
  .skin .sw { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 7px;
    box-shadow: 0 0 12px rgba(255,255,255,.25); }
  .skin .nm { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: #fff; }
  .skin .pr { font-size: 11px; color: #b79be6; margin-top: 2px; }

  .loader { display: flex; gap: 14px; margin-top: 26px; justify-content: center; }
  .loader i { width: 14px; height: 14px; border-radius: 50%; background: #cdb6ff;
    animation: pulse 1s infinite ease-in-out; }
  .loader i:nth-child(2){ animation-delay: .15s; }
  .loader i:nth-child(3){ animation-delay: .3s; }
  .loader i:nth-child(4){ animation-delay: .45s; }
  @keyframes pulse { 0%,100%{ opacity:.3; transform: scale(.8);} 50%{ opacity:1; transform: scale(1.15);} }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Version badge (always visible) -->
  <div class="version" id="version">v1.0</div>

  <!-- In-game HUD -->
  <div class="hud" id="hud">
    <button class="menu-btn" id="btnMenu">
      <span class="arrow">&#8592;</span>
      <span>MAIN</span><span>MENU</span>
    </button>
    <div class="title-wrap">
      <div class="title" id="hudTitle">slider</div>
      <div class="score" id="hudScore">0</div>
      <div class="powers" id="hudPowers"></div>
    </div>
    <div class="diamonds"><span id="hudGems">0</span><span class="gem"></span></div>
  </div>

  <!-- Loading screen -->
  <div class="screen" id="loadScreen">
    <div class="panel">
      <div class="big" style="color:#fff">slider</div>
      <div class="loader"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>

  <!-- Main menu -->
  <div class="screen hidden" id="menuScreen">
    <div class="panel">
      <div class="big">slider</div>
      <div class="sub">NEON RIDER</div>
      <div class="stats" id="menuStats">best distance <b>0</b> &nbsp;·&nbsp; gems <b>0</b></div>
      <div class="btn-row">
        <button class="btn primary" id="btnPlay">PLAY</button>
        <button class="btn" id="btnGarage">GARAGE</button>
      </div>
      <div class="missions" id="menuMissions"></div>
      <div class="hint">HOLD&nbsp; SPACE&nbsp;/&nbsp;CLICK&nbsp;/&nbsp;TAP&nbsp;&nbsp;to accelerate &amp; flip</div>
    </div>
  </div>

  <!-- Garage / skin shop -->
  <div class="screen hidden" id="garageScreen">
    <div class="panel">
      <div class="big" style="font-size:clamp(30px,6vw,52px)">garage</div>
      <div class="sub">SPEND DIAMONDS ON BIKE SKINS</div>
      <div class="stats">wallet <b id="garageWallet">0</b> &#9670;</div>
      <div class="skin-grid" id="skinGrid"></div>
      <div class="btn-row" style="margin-top:24px">
        <button class="btn" id="btnGarageBack">BACK</button>
      </div>
    </div>
  </div>

  <!-- Game over -->
  <div class="screen hidden" id="overScreen">
    <div class="panel">
      <div class="gameover">GAME OVER</div>
      <div class="sub">WOULD YOU LIKE TO PLAY AGAIN?</div>
      <div class="stats" id="overStats"></div>
      <div class="btn-row">
        <button class="btn primary" id="btnAgain">PLAY AGAIN</button>
        <button class="btn" id="btnBack">MENU</button>
      </div>
    </div>
  </div>

<script>
"use strict";
/* =========================================================================
   SLIDER — a one-button neon motorcycle game
   Pure HTML5 Canvas + Web Audio API. No external libraries.
   ========================================================================= */

const VERSION = '1.7';   // bump on every released version
document.getElementById('version').textContent = 'v' + VERSION;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------------------------------------------------------------- palettes */
// Each level (round) recolours the track, the vehicle and the background glow.
const PALETTES = [
  { name:'purple', line:'#c04bff', line2:'#7a1fd0', bg1:'#1a0940', bg2:'#0a0322', veh:'#ffd400', title:'#ff5cf0' },
  { name:'cyan',   line:'#25e6ff', line2:'#0d7fd6', bg1:'#0a1c4a', bg2:'#050c26', veh:'#ff4fa3', title:'#7cf9ff' },
  { name:'green',  line:'#39ff8b', line2:'#0fae66', bg1:'#08331f', bg2:'#031409', veh:'#ff5ce1', title:'#8dffb8' },
  { name:'red',    line:'#ff4d5e', line2:'#c31a55', bg1:'#3a0a1c', bg2:'#160410', veh:'#ffe23d', title:'#ff8fa0' },
  { name:'magenta',line:'#ff45d1', line2:'#a017c9', bg1:'#2a0940', bg2:'#100322', veh:'#5cff8f', title:'#ff9ff0' },
  { name:'blue',   line:'#4f7dff', line2:'#1f3fd0', bg1:'#0b1440', bg2:'#040a22', veh:'#ffb03d', title:'#9fb6ff' },
];
function paletteForDistance(d) {
  return PALETTES[Math.floor(d / 350) % PALETTES.length];
}

/* ---------------------------------------------------------------- terrain */
// Smooth procedural terrain from layered value-noise. terrain(x) -> world Y.
function hash(n){ const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
function smoothNoise(x){
  const xi = Math.floor(x), xf = x - xi;
  const a = hash(xi), b = hash(xi + 1);
  const u = xf * xf * (3 - 2 * xf);       // smoothstep interpolation
  return a + (b - a) * u;
}
const BASE_Y = 0;                          // terrain oscillates around world y = 0
function terrainY(x){
  // Difficulty ramps amplitude very gently with distance.
  const diff = 1 + Math.min(x / 9000, 1.1);
  const big   = (smoothNoise(x / 520) - 0.5) * 330 * diff;   // rolling hills
  const mid   = (smoothNoise(x / 190 + 40) - 0.5) * 150 * diff;
  const small = (smoothNoise(x / 95 + 90) - 0.5) * 30;
  const wave  = Math.sin(x / 240) * 46;
  return BASE_Y + big + mid + small + wave + gapShape(x);
}
function terrainSlope(x){
  const d = 3.5;
  return Math.atan2(terrainY(x + d) - terrainY(x - d), 2 * d);
}

// --- gaps: every so often the line simply breaks. Deterministic from x, so
// physics and rendering always agree. Fall in and it's game over — jump it.
// The terrain is shaped around every gap: a kicker ramp rises to the near lip
// and the landing beyond sits lower, so each gap is clearable at speed.
const GAP_SEG = 2600;         // average spacing between potential gaps
function gapAt(seg){
  if (seg < 1) return null;                        // safe runway after spawn
  if (hash(seg * 7.13 + 3.7) < 0.55) return null;  // ~45% of segments have one
  const w = 110 + hash(seg * 3.1 + 1.2) * 140;
  const c = seg * GAP_SEG + GAP_SEG * 0.5 + (hash(seg * 9.7) - 0.5) * 500;
  return { c, w };
}
function inGap(x){
  const g = gapAt(Math.floor(x / GAP_SEG));
  return !!g && Math.abs(x - g.c) < g.w / 2;
}
function gapShape(x){
  const g = gapAt(Math.floor(x / GAP_SEG));
  if (!g) return 0;
  const lipL = g.c - g.w/2, lipR = g.c + g.w/2;
  if (x >= lipL - 300 && x < lipL){
    const t = (x - (lipL - 300)) / 300;
    return -55 * t * t;                    // kicker ramp rising to the lip
  }
  if (x >= lipL && x <= lipR) return -55;  // keeps the lip edges consistent
  if (x > lipR && x < lipR + 500){
    const t = (x - lipR) / 500;
    return 35 * (1 - t*t*(3 - 2*t));       // lowered landing easing back up
  }
  return 0;
}

/* ---------------------------------------------------------------- audio */
const Sound = (function(){
  let actx = null, master = null, musicOn = false, musicTimer = null, step = 0;
  function ensure(){
    if (actx) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value = 0.5;
      master.connect(actx.destination);
    } catch(e){ actx = null; }
  }
  function resume(){ ensure(); if (actx && actx.state === 'suspended') actx.resume(); }

  function blip(freq, dur, type, vol, glideTo){
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    const t = actx.currentTime;
    o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noiseBurst(dur, vol){
    if (!actx) return;
    const n = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, n, actx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<n;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2);
    const src = actx.createBufferSource(); src.buffer = buf;
    const g = actx.createGain(); g.gain.value = vol || 0.5;
    const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 1400;
    src.connect(f); f.connect(g); g.connect(master); src.start();
  }

  // Simple looping synth-wave bassline / arpeggio.
  const SCALE = [220.00, 261.63, 329.63, 392.00, 440.00, 523.25];
  function startMusic(){
    ensure(); if (!actx || musicOn) return;
    musicOn = true; step = 0;
    const beat = 0.34;
    musicTimer = setInterval(function(){
      if (!actx) return;
      const bassNotes = [110, 110, 146.83, 130.81];
      const bf = bassNotes[Math.floor(step/4) % bassNotes.length];
      if (step % 2 === 0) blip(bf, beat*1.9, 'triangle', 0.14);
      const note = SCALE[(step*2 + (step%3)) % SCALE.length];
      blip(note * 2, beat*0.9, 'sawtooth', 0.05);
      if (step % 4 === 2) noiseBurst(0.04, 0.10); // hat
      step++;
    }, beat * 1000);
  }
  function stopMusic(){ if (musicTimer){ clearInterval(musicTimer); musicTimer = null; } musicOn = false; }

  return {
    resume,
    jump(){ blip(320, 0.16, 'square', 0.2, 620); },
    gem(){ blip(880, 0.10, 'sine', 0.28, 1320); setTimeout(()=>blip(1320,0.10,'sine',0.2),60); },
    power(){ blip(520, 0.09, 'square', 0.22, 1040); setTimeout(()=>blip(1040,0.12,'sine',0.2,1560),70); },
    flip(){ blip(520, 0.12, 'square', 0.18, 780); },
    land(){ blip(240, 0.09, 'sine', 0.16, 180); },
    crash(){
      noiseBurst(0.5, 0.6);
      blip(160, 0.5, 'sawtooth', 0.28, 40);
    },
    startMusic, stopMusic
  };
})();

/* ---------------------------------------------------------------- game state */
const State = { LOADING:0, MENU:1, PLAYING:2, OVER:3 };
let state = State.LOADING;

const player = {
  x: 0, y: 0, vx: 0, vy: 0,
  angle: 0, va: 0,    // orientation + angular velocity (rad/s)
  grounded: true,
  spin: 0,            // cumulative rotation while airborne (for flip counting)
  airTime: 0,
  jumpPending: false,
  size: 16,
};

let camX = 0, camY = 0;
let distance = 0, startX = 0;
let gems = 0;
let level = 0;
let palette = PALETTES[0];
let holding = false;

let diamonds = [];      // {x, y, got}
let powerups = [];      // special pickups {x, y, type, got, ph}
let nextPowerX = 0;
// active effects: timers in seconds; shield is held until it saves you once
const POWER = { turbo:0, magnet:0, lowgrav:0, shield:false, invuln:0 };
const POWER_STYLE = {
  turbo:   { color:'#ff9d2e' },
  shield:  { color:'#35e0ff' },
  magnet:  { color:'#ff4fd8' },
  lowgrav: { color:'#b06bff' },
};
const POWER_LABEL = { turbo:'TURBO!', shield:'SHIELD!', magnet:'MAGNET!', lowgrav:'LOW-G!' };
// combo: every trick (praised landing, hoop) bumps the multiplier; it decays
// after a few seconds without a trick and all style bonuses are multiplied
let combo = 1, comboTime = 0;
let hoops = [];         // aerial rings {x, y, got, ph}
let nextHoopX = 0;
let obstacles = [];     // spikes on the line {x, hit} — hop over or crash
let nextObsX = 0;
let curZoneKey = null;  // banner shown once per zone entry
let particles = [];     // explosion / trail particles
let floaters = [];      // floating praise text
let lastScoreX = null;  // world x where the player crashed last run
let bestDistance = Number(localStorage.getItem('slider_best') || 0);
let bestGems = Number(localStorage.getItem('slider_gems') || 0);
let wallet = Number(localStorage.getItem('slider_wallet') || 0);   // spendable diamonds

// ghost of the best run: positions sampled every 60ms, raced in real time
let ghost = null;
try { ghost = JSON.parse(localStorage.getItem('slider_ghost') || 'null'); } catch(e){}
let runSamples = [], sampleAcc = 0, ghostT = 0;

// bike skins bought with diamonds
const SKINS = [
  { id:'neon',  name:'NEON',  color:null,      price:0 },
  { id:'pink',  name:'PINK',  color:'#ff4fa3', price:60 },
  { id:'green', name:'VENOM', color:'#5cff8f', price:120 },
  { id:'blue',  name:'ICE',   color:'#4fc3ff', price:180 },
  { id:'white', name:'GHOST', color:'#ffffff', price:250 },
  { id:'gold',  name:'GOLD',  color:'#ffd23d', price:400 },
];
let ownedSkins = ['neon'];
try { ownedSkins = JSON.parse(localStorage.getItem('slider_skins') || '["neon"]'); } catch(e){}
let activeSkin = localStorage.getItem('slider_skin') || 'neon';
function skinColor(){ const s = SKINS.find(s => s.id === activeSkin); return s ? s.color : null; }

// daily missions: 3 picked deterministically from the date, reward 15 diamonds
const MISSION_POOL = [
  { id:'gems',  target:30,  label:'collect 30 diamonds' },
  { id:'flips', target:3,   label:'land 3 flips' },
  { id:'hoops', target:5,   label:'fly through 5 hoops' },
  { id:'score', target:300, label:'score 300 in one run' },
  { id:'airs',  target:8,   label:'8 big airs (0.5s+)' },
  { id:'power', target:4,   label:'grab 4 power-ups' },
];
function dayKey(){ const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function todaysMissions(){
  const k = dayKey(); let h = 0;
  for (const ch of k) h = (h*31 + ch.charCodeAt(0)) % 1000000;
  const idx = []; let j = h % 6;
  while (idx.length < 3){ if (!idx.includes(j % 6)) idx.push(j % 6); j++; }
  return idx.map(i => MISSION_POOL[i]);
}
function loadMissions(){
  let m = null;
  try { m = JSON.parse(localStorage.getItem('slider_missions') || 'null'); } catch(e){}
  if (!m || m.day !== dayKey()) m = { day: dayKey(), prog:{}, done:{} };
  return m;
}
let missionState = loadMissions();
function missionProg(id, n, mode){
  if (missionState.day !== dayKey()) missionState = loadMissions();
  const def = todaysMissions().find(t => t.id === id);
  if (!def || missionState.done[id]) return;
  const cur = missionState.prog[id] || 0;
  missionState.prog[id] = mode === 'max' ? Math.max(cur, n) : cur + n;
  if (missionState.prog[id] >= def.target){
    missionState.done[id] = true;
    wallet += 15; localStorage.setItem('slider_wallet', wallet);
    addFloater('MISSION! +15', player.x, player.y - 70, '#ffd23d');
    Sound.power();
  }
  try { localStorage.setItem('slider_missions', JSON.stringify(missionState)); } catch(e){}
}

const PRAISE = ['smooth!','great!','aced!','WOW!'];

// --- physics: a small 2D rigid body (two wheels + chassis) riding the line.
// This model IS the game: throttle to build speed, ballistic launches off
// crests, backflip torque in the air, and wheels-first landings that pivot
// smoothly onto both wheels instead of snapping.
const GRAVITY = 1200;
const ENGINE_F = 1700;        // throttle force while holding (on the ground)
const ROLL_F = 260;           // rolling resistance when released — the bike rolls out
const DRAG = 0.35;            // speed-proportional drag on top of rolling resistance
const PARK_SPEED = 40;        // near standstill the brakes hold it (no self-rolling)
const MAX_DRIVE_SPEED = 780;  // throttle stops pushing past this
const MAX_SPEED = 1200;       // hard safety cap
const SPIN_RATE = 8.0;        // target backflip rate in the air (rad/s, backwards)
const SPIN_EASE = 4;          // gradual ramp: short hops tilt a little, big airs flip
const AIR_SPIN_DELAY = 0.15;  // holding flips only on real jumps, not bump-hops
const AIR_DAMP = 2.6;         // releasing mid-air steadies the rotation
const ALIGN_K = 12;           // released in air: gentle pull toward the landing slope
const ALIGN_MAX = 18;         // cap on that corrective torque (rad/s^2)
const MAX_VA = 13;            // rotation speed clamp (rad/s)
const INV_M = 1;              // 1 / mass
const INV_I = 1 / 420;        // 1 / moment of inertia
const SUSPENSION = 0.75;      // fraction of impact absorbed per substep (softens hits)
const CONTACT_VA_MAX = 2.2;   // max rotation a single substep of contact may inject
                              // (suspension soaks up kicker hits instead of looping the bike)
const WHEEL_R = 6.4;
const WHEELS = [{ox:-11, oy:8}, {ox:11, oy:8}];   // rear, front (local coords)
// chassis + rider sample points — if any of these touches the line, it's a crash
const BODY_PTS = [{ox:-13,oy:-2},{ox:-6,oy:-8},{ox:4,oy:-10},{ox:13,oy:-3},{ox:1,oy:-15}];

/* ---------------------------------------------------------------- helpers */
function landedFeedback(slope){
  const p = player;
  const flips = Math.floor(Math.abs(p.spin) / (Math.PI*2) + 0.12);
  let praise = null;
  if (flips >= 2) praise = 'WOW!';
  else if (flips === 1) praise = 'aced!';
  else if (p.airTime > 0.9) praise = 'great!';
  else if (p.airTime > 0.45) praise = 'smooth!';
  if (praise){
    const bonus = (20 + flips*40 + Math.floor(p.airTime*20)) * combo;
    distance += bonus / 6; // style bonus, scaled by the combo multiplier
    addFloater(combo > 1 ? praise + ' x' + combo : praise, p.x, p.y - 40, '#ffffff');
    addCombo();
  }
  if (flips > 0) missionProg('flips', flips);
  if (p.airTime > 0.5) missionProg('airs', 1);
  Sound.land();
  for (let i=0;i<10;i++){
    const a = slope + Math.PI + (Math.random()-0.5);
    particles.push({ x:p.x, y:p.y+p.size*0.6, vx:Math.cos(a)*120, vy:Math.sin(a)*120-40,
      life:0.4, max:0.4, size:2+Math.random()*2, color:palette.line });
  }
}

function spawnDiamondsAhead(){
  // Keep a rolling set of diamonds ahead of the player.
  const ahead = player.x + W;
  let lastX = diamonds.length ? diamonds[diamonds.length-1].x : player.x + 200;
  while (lastX < ahead + 400){
    // occasionally drop a short cluster of gems hugging the track
    if (Math.random() < 0.7){
      const cluster = 1 + (Math.random()<0.4 ? 1 + (Math.random()<0.4?1:0) : 0);
      for (let c=0;c<cluster;c++){
        lastX += 120 + Math.random()*70;
        // most gems sit just above the line (grabbable while riding);
        // a few float higher to reward small hops
        const offset = (Math.random()<0.75) ? 20 + Math.random()*26   // low: 20-46
                                             : 55 + Math.random()*55;  // high: 55-110
        diamonds.push({ x:lastX, y:terrainY(lastX) - offset, got:false, ph:Math.random()*6.28 });
      }
    }
    lastX += 150 + Math.random()*180;
  }
  // drop diamonds well behind the camera
  while (diamonds.length && diamonds[0].x < player.x - W) diamonds.shift();
}

function spawnPowerupsAhead(){
  const ahead = player.x + W + 600;
  while (nextPowerX < ahead){
    const types = ['turbo','shield','magnet','lowgrav'];
    const t = types[Math.floor(Math.random()*types.length)];
    powerups.push({ x:nextPowerX, y:terrainY(nextPowerX) - (46 + Math.random()*70),
                    type:t, got:false, ph:Math.random()*6.28 });
    nextPowerX += 2400 + Math.random()*2200;
  }
  while (powerups.length && powerups[0].x < player.x - W) powerups.shift();
}

function spawnHoopsAhead(){
  const ahead = player.x + W + 600;
  while (nextHoopX < ahead){
    hoops.push({ x:nextHoopX, y:terrainY(nextHoopX) - (115 + Math.random()*70),
                 got:false, ph:Math.random()*6.28 });
    nextHoopX += 1800 + Math.random()*1900;
  }
  while (hoops.length && hoops[0].x < player.x - W) hoops.shift();
}

function spawnObstaclesAhead(){
  const ahead = player.x + W + 600;
  while (nextObsX < ahead){
    const x = nextObsX;
    // keep spikes away from chasms and their ramp/landing shaping
    if (!inGap(x) && gapShape(x - 240) === 0 && gapShape(x + 240) === 0){
      obstacles.push({ x, hit:false });
    }
    nextObsX += 1900 + Math.random()*1900;
  }
  while (obstacles.length && obstacles[0].x < player.x - W) obstacles.shift();
}

// --- event zones: an occasional stretch of track is special.
// storm = gusty side-wind while airborne; night = you only see near the bike.
const ZONE_SEG = 9000;
function zoneAt(seg){
  if (seg < 1) return null;
  if (hash(seg * 4.77 + 9.1) < 0.55) return null;
  const a = seg * ZONE_SEG + 1500 + hash(seg * 8.3) * 2000;
  const len = 1600 + hash(seg * 5.9) * 1200;
  return { type: hash(seg * 11.3) < 0.5 ? 'storm' : 'night', a, b: a + len };
}
function zoneOf(x){
  const z = zoneAt(Math.floor(x / ZONE_SEG));
  return (z && x >= z.a && x <= z.b) ? z : null;
}

function addCombo(){
  combo = Math.min(combo + 1, 9);
  comboTime = 6;
}

function applyPower(type){
  if (type === 'turbo')        POWER.turbo   = 5.5;
  else if (type === 'magnet')  POWER.magnet  = 7;
  else if (type === 'lowgrav') POWER.lowgrav = 5.5;
  else if (type === 'shield')  POWER.shield  = true;
}

// the shield spends itself to turn a fatal crash into a wobble-through
function shieldRescue(){
  const p = player;
  POWER.shield = false; POWER.invuln = 1.2;
  const sl = terrainSlope(p.x);
  p.angle = sl; p.va = 0;
  p.y = terrainY(p.x) - 15;
  let vt = Math.max(p.vx * Math.cos(sl) + p.vy * Math.sin(sl), 260);
  p.vx = Math.cos(sl) * vt; p.vy = Math.sin(sl) * vt;
  p.grounded = true; p.spin = 0; p.airTime = 0;
  shake = 8;
  addFloater('SHIELD!', p.x, p.y - 46, '#7ff0ff');
  for (let i=0;i<26;i++){
    const a = Math.random()*6.28, s = 80 + Math.random()*220;
    particles.push({ x:p.x, y:p.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 40,
      life:0.6, max:0.6, size:2+Math.random()*3, color:'#7ff0ff' });
  }
  Sound.power();
}

function addFloater(text, x, y, color){
  floaters.push({ text, x, y, life:1.2, color:color||'#fff' });
}

function explode(x, y, color){
  for (let i=0;i<46;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 60 + Math.random()*360;
    particles.push({
      x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 60,
      life: 0.7 + Math.random()*0.7, max: 1.4,
      size: 2 + Math.random()*4,
      color: Math.random()<0.5 ? color : '#ffffff'
    });
  }
}

/* ---------------------------------------------------------------- lifecycle */
function startGame(){
  Sound.resume();
  Sound.startMusic();
  state = State.PLAYING;
  distance = 0; gems = 0; level = 0;
  palette = PALETTES[0];
  diamonds = []; particles = []; floaters = [];

  startX = 400;
  player.x = startX;
  player.y = terrainY(startX) - player.size;
  player.vx = 0; player.vy = 0; player.va = 0;
  player.angle = terrainSlope(startX);
  player.grounded = true; player.spin = 0; player.airTime = 0;
  player.jumpPending = false;
  camX = player.x - W*0.32;
  camY = player.y - H*0.5;
  powerups = [];
  nextPowerX = startX + 1600;
  POWER.turbo = 0; POWER.magnet = 0; POWER.lowgrav = 0;
  POWER.shield = false; POWER.invuln = 0;
  combo = 1; comboTime = 0;
  hoops = []; nextHoopX = startX + 2200;
  obstacles = []; nextObsX = startX + 2600;
  curZoneKey = null;
  runSamples = []; sampleAcc = 0; ghostT = 0;
  spawnDiamondsAhead();
  spawnPowerupsAhead();
  spawnHoopsAhead();
  spawnObstaclesAhead();

  hud.classList.remove('hidden');
  loadScreen.classList.add('hidden');
  menuScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  garageScreen.classList.add('hidden');
  applyPalette(palette);
}

function gameOver(){
  state = State.OVER;
  lastScoreX = player.x;
  Sound.crash();
  explode(player.x, player.y, skinColor() || palette.veh);
  // shake
  shake = 18;
  const d = Math.floor(distance);
  if (d > bestDistance){ bestDistance = d; localStorage.setItem('slider_best', d); }
  if (gems > bestGems){ bestGems = gems; localStorage.setItem('slider_gems', gems); }
  wallet += gems;
  localStorage.setItem('slider_wallet', wallet);
  missionProg('score', d, 'max');
  // keep the best run as the ghost
  if (d >= ((ghost && ghost.d) || 20) && runSamples.length > 6){
    ghost = { d, s: runSamples.slice() };
    try { localStorage.setItem('slider_ghost', JSON.stringify(ghost)); } catch(e){}
  }
  overStats.innerHTML = `distance <b>${d}</b> &nbsp;·&nbsp; gems <b>+${gems}</b> &nbsp;·&nbsp; wallet <b>${wallet}</b><br>` +
                        `best <b>${bestDistance}</b>`;
  // brief delay so the explosion is visible before the modal
  setTimeout(()=>{ if (state===State.OVER) overScreen.classList.remove('hidden'); }, 650);
}

function toMenu(){
  state = State.MENU;
  Sound.stopMusic();
  hud.classList.add('hidden');
  overScreen.classList.add('hidden');
  loadScreen.classList.add('hidden');
  garageScreen.classList.add('hidden');
  menuScreen.classList.remove('hidden');
  menuStats.innerHTML = `best distance <b>${bestDistance}</b> &nbsp;·&nbsp; wallet <b>${wallet}</b> &#9670;`;
  const todays = todaysMissions();
  menuMissions.innerHTML = '<b>DAILY MISSIONS</b><br>' + todays.map(m => {
    const done = missionState.done[m.id];
    const pr = Math.min(missionState.prog[m.id] || 0, m.target);
    return done ? `<span class="mdone">&#10003; ${m.label}</span>`
                : `<span>${pr}/${m.target} — ${m.label}</span>`;
  }).join('<br>');
  applyPalette(PALETTES[0]);
}

function renderGarage(){
  garageWallet.textContent = wallet;
  skinGrid.innerHTML = SKINS.map(s => {
    const owned = ownedSkins.includes(s.id);
    const act = s.id === activeSkin;
    const sw = s.color || 'linear-gradient(135deg,#ffd400,#ff5cf0,#25e6ff)';
    return `<div class="skin ${act?'active':''}" data-id="${s.id}">
      <div class="sw" style="background:${sw}"></div>
      <div class="nm">${s.name}</div>
      <div class="pr">${act ? 'ACTIVE' : owned ? 'OWNED' : s.price + ' &#9670;'}</div>
    </div>`;
  }).join('');
}

function applyPalette(p){
  document.documentElement.style.setProperty('--neon', p.line);
  hudTitle.style.color = p.title;
  hudTitle.style.textShadow = `0 0 14px ${p.title}, 0 0 26px ${p.line}`;
}

/* ---------------------------------------------------------------- input */
function press(){
  holding = true;
  if (state === State.PLAYING && player.grounded === false) Sound.flip();
}
function release(){ holding = false; }

window.addEventListener('keydown', (e)=>{
  if (e.code === 'Space' || e.code === 'ArrowUp'){
    e.preventDefault();
    if (!e.repeat){
      Sound.resume();
      if (state === State.PLAYING) press();
      else if (state === State.MENU) startGame();
      else if (state === State.OVER) startGame();
    }
  }
});
window.addEventListener('keyup', (e)=>{ if (e.code==='Space'||e.code==='ArrowUp') release(); });

canvas.addEventListener('pointerdown', (e)=>{ Sound.resume(); if (state===State.PLAYING) press(); });
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);

document.getElementById('btnPlay').addEventListener('click', startGame);
document.getElementById('btnAgain').addEventListener('click', startGame);
document.getElementById('btnBack').addEventListener('click', toMenu);
document.getElementById('btnMenu').addEventListener('click', toMenu);
document.getElementById('btnGarage').addEventListener('click', ()=>{
  menuScreen.classList.add('hidden');
  garageScreen.classList.remove('hidden');
  renderGarage();
});
document.getElementById('btnGarageBack').addEventListener('click', toMenu);
document.getElementById('skinGrid').addEventListener('click', (e)=>{
  const el = e.target.closest('.skin');
  if (!el) return;
  const s = SKINS.find(k => k.id === el.dataset.id);
  if (!ownedSkins.includes(s.id)){
    if (wallet < s.price) return;             // can't afford it yet
    wallet -= s.price;
    localStorage.setItem('slider_wallet', wallet);
    ownedSkins.push(s.id);
    localStorage.setItem('slider_skins', JSON.stringify(ownedSkins));
    Sound.resume(); Sound.power();
  }
  activeSkin = s.id;
  localStorage.setItem('slider_skin', activeSkin);
  renderGarage();
});

// Reveal menu after a short "boot" sequence.
setTimeout(toMenu, 1400);

/* ---------------------------------------------------------------- update */
let shake = 0;

function update(dt){
  if (state !== State.PLAYING) {
    // still advance particles/floaters so the explosion animates on game over
    updateEffects(dt);
    return;
  }

  const p = player;

  /* --- rigid-body substeps: two wheels + chassis riding the neon line ---
     Each wheel collides with the track independently. A rear-wheel landing
     receives an impulse at the contact point, which pivots the chassis
     smoothly onto the front wheel — no angle snapping anywhere. */
  const STEPS = 6;
  const h = dt / STEPS;

  // combo decay
  comboTime = Math.max(0, comboTime - dt);
  if (comboTime === 0) combo = 1;

  // power-up timers
  POWER.turbo   = Math.max(0, POWER.turbo   - dt);
  POWER.magnet  = Math.max(0, POWER.magnet  - dt);
  POWER.lowgrav = Math.max(0, POWER.lowgrav - dt);
  POWER.invuln  = Math.max(0, POWER.invuln  - dt);
  const gravNow = GRAVITY * (POWER.lowgrav > 0 ? 0.55 : 1);

  // event zones
  const zone = zoneOf(p.x);
  const zoneKey = zone ? zone.type + zone.a : null;
  if (zoneKey !== curZoneKey){
    if (zone) addFloater(zone.type === 'storm' ? 'STORM ZONE!' : 'NIGHT ZONE!',
                         p.x + 160, p.y - 100, zone.type === 'storm' ? '#8fb4ff' : '#c9b8ff');
    curZoneKey = zoneKey;
  }
  if (zone && zone.type === 'storm'){
    // gusty side-wind — hits hardest while airborne
    const wind = Math.sin(performance.now()/900 + p.x*0.002) * 260;
    p.vx += wind * dt * (p.grounded ? 0.25 : 1);
    if (Math.random() < 0.5){
      particles.push({ x:camX + Math.random()*W, y:camY + Math.random()*H*0.85,
        vx: wind*1.8 + (Math.random()-0.5)*80, vy: 30+Math.random()*50,
        life:0.5, max:0.5, size:1.8+Math.random()*1.5, color:'#8fb4ff' });
    }
  }

  for (let s = 0; s < STEPS; s++){
    // gravity
    p.vy += gravNow * h;

    // air control: hold = backflip torque (on real jumps), release = recover.
    // Releasing steadies the spin AND gently pulls the bike toward the slope
    // it is falling onto — you can save an early bail-out, never a late flip.
    if (!p.grounded){
      p.airTime += h;
      if (holding && p.airTime > AIR_SPIN_DELAY){
        p.va += ((-SPIN_RATE) - p.va) * Math.min(1, SPIN_EASE * h);
      } else {
        p.va -= p.va * Math.min(1, AIR_DAMP * h);
        let d = terrainSlope(p.x + p.vx * 0.15) - p.angle;
        while (d >  Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        p.va += Math.max(-ALIGN_MAX, Math.min(ALIGN_MAX, d * ALIGN_K)) * h;
      }
      p.spin += p.va * h;
    }

    // integrate
    p.x += p.vx * h;
    p.y += p.vy * h;
    p.angle += p.va * h;

    // wheel contacts — velocity impulses + soft positional correction.
    // Rotation injected by contacts is capped per substep, so a kicker lofts
    // the nose moderately instead of looping the whole bike.
    let contacts = 0, slopeSum = 0, rearC = false, frontC = false, vaAcc = 0;
    for (let iter = 0; iter < 2; iter++){
      contacts = 0; slopeSum = 0; rearC = false; frontC = false;
      const ca = Math.cos(p.angle), sa = Math.sin(p.angle);
      for (let wi = 0; wi < 2; wi++){
        const w = WHEELS[wi];
        const wx = p.x + w.ox*ca - w.oy*sa;
        const wy = p.y + w.ox*sa + w.oy*ca;
        if (inGap(wx)) continue;             // no line to ride over a chasm
        const pen = wy + WHEEL_R - terrainY(wx);
        if (pen <= 0) continue;
        contacts++; if (wi === 0) rearC = true; else frontC = true;
        const sl = terrainSlope(wx); slopeSum += sl;
        const nx = Math.sin(sl), ny = -Math.cos(sl);   // up, out of the track
        const rx = wx - p.x, ry = wy - p.y;
        const rn = rx*ny - ry*nx;
        const denom = INV_M + rn*rn*INV_I;
        // absorb the velocity going into the track at this wheel — partial
        // per substep, so hits are cushioned like suspension travel
        const vn = (p.vx - (p.va + vaAcc)*ry)*nx + (p.vy + (p.va + vaAcc)*rx)*ny;
        if (vn < 0){
          const j = -vn * SUSPENSION / denom;
          p.vx += j*nx*INV_M; p.vy += j*ny*INV_M; vaAcc += j*rn*INV_I;
        }
        // ease the wheel out of the ground (rotating the chassis naturally)
        const corr = Math.max(pen - 0.3, 0) * 0.45 / denom;
        p.x += corr*nx*INV_M; p.y += corr*ny*INV_M; p.angle += corr*rn*INV_I;
      }
    }
    p.va += Math.max(-CONTACT_VA_MAX, Math.min(CONTACT_VA_MAX, vaAcc));
    if (p.va > MAX_VA) p.va = MAX_VA; else if (p.va < -MAX_VA) p.va = -MAX_VA;

    const wasAir = !p.grounded;
    p.grounded = contacts > 0;

    if (p.grounded){
      const sl = slopeSum / contacts;
      const tx = Math.cos(sl), ty = Math.sin(sl);
      const nx = Math.sin(sl), ny = -Math.cos(sl);
      let vt = p.vx*tx + p.vy*ty;
      const vn = p.vx*nx + p.vy*ny;
      if (holding){
        // throttle pushes along the track (downhill gravity adds on top)
        const maxD = POWER.turbo > 0 ? MAX_DRIVE_SPEED * 1.45 : MAX_DRIVE_SPEED;
        const eng  = POWER.turbo > 0 ? ENGINE_F * 1.7 : ENGINE_F;
        if (vt < maxD) vt += eng * h;
      } else {
        // released: momentum carries the bike — it rolls out gradually under
        // rolling resistance + drag (and keeps rolling on a downhill). Only
        // near standstill does the parking brake hold it, so it never
        // starts moving by itself.
        if (Math.abs(vt) < PARK_SPEED){
          vt = 0;
        } else {
          const dec = (ROLL_F + Math.abs(vt) * DRAG) * h;
          vt -= Math.sign(vt) * Math.min(Math.abs(vt), dec);
        }
      }
      p.vx = tx*vt + nx*vn;
      p.vy = ty*vt + ny*vn;
      // chassis tracks the terrain while riding: damped spring toward the
      // slope (tyres + suspension), and grounded spin is physically limited —
      // a bike with a wheel on the ground cannot wind up into a loop
      p.va -= p.va * Math.min(1, (rearC && frontC ? 12 : 6) * h);
      let dAng = sl - p.angle;
      while (dAng >  Math.PI) dAng -= Math.PI * 2;
      while (dAng < -Math.PI) dAng += Math.PI * 2;
      p.va += Math.max(-22, Math.min(22, dAng * 14)) * h;
      if (p.va > 6) p.va = 6; else if (p.va < -6) p.va = -6;

      if (wasAir && p.airTime > 0.12){
        landedFeedback(sl);
        p.spin = 0; p.airTime = 0;
      }
    } else if (!wasAir){
      // took off
      p.spin = 0; p.airTime = 0; p.jumpPending = true;
    }

    // crash: the chassis or the rider touches the line — wheels never crash.
    // A held shield turns one fatal hit into a save instead.
    if (POWER.invuln <= 0){
      const cca = Math.cos(p.angle), csa = Math.sin(p.angle);
      for (const b of BODY_PTS){
        const bx = p.x + b.ox*cca - b.oy*csa;
        const by = p.y + b.ox*csa + b.oy*cca;
        if (!inGap(bx) && by > terrainY(bx) + 1.5){
          if (POWER.shield){ shieldRescue(); break; }
          gameOver(); return;
        }
      }
    }
  }

  // fell into a chasm
  if (p.y > 1300){ gameOver(); return; }

  // real jumps get a sound; skimming a bump stays silent
  if (p.jumpPending && !p.grounded && p.airTime > 0.12){ Sound.jump(); p.jumpPending = false; }
  if (p.grounded) p.jumpPending = false;

  // hard safety cap
  const spd = Math.hypot(p.vx, p.vy);
  if (spd > MAX_SPEED){ p.vx *= MAX_SPEED/spd; p.vy *= MAX_SPEED/spd; }

  // engine trail while riding (only when actually moving)
  if (p.grounded && Math.hypot(p.vx, p.vy) > 80 && Math.random() < 0.6){
    particles.push({ x:p.x - Math.cos(p.angle)*p.size, y:p.y - Math.sin(p.angle)*p.size + 4,
      vx:-40+Math.random()*20, vy:-20-Math.random()*30, life:0.35, max:0.35,
      size:2+Math.random()*2, color:palette.line });
  }
  // turbo exhaust flame
  if (POWER.turbo > 0 && p.grounded){
    for (let i=0;i<2;i++){
      particles.push({ x:p.x - Math.cos(p.angle)*18, y:p.y - Math.sin(p.angle)*18,
        vx:-Math.cos(p.angle)*(160+Math.random()*120), vy:-Math.sin(p.angle)*160 - Math.random()*40,
        life:0.3, max:0.3, size:2.5+Math.random()*2.5,
        color: Math.random()<0.5 ? '#ff9d2e' : '#ffd23d' });
    }
  }

  // distance / score
  distance = Math.max(distance, (p.x - startX) / 40);

  // ghost recording + playback clock
  ghostT += dt; sampleAcc += dt;
  if (sampleAcc >= 0.06 && runSamples.length < 9000){
    sampleAcc -= 0.06;
    runSamples.push(p.x, p.y, p.angle);
  }

  // level / palette by distance
  const np = paletteForDistance(distance);
  if (np !== palette){ palette = np; applyPalette(palette); }

  // diamonds
  spawnDiamondsAhead();
  for (const d of diamonds){
    if (d.got) continue;
    if (POWER.magnet > 0){
      const ddx = p.x - d.x, ddy = p.y - d.y;
      if (ddx*ddx + ddy*ddy < 170*170){
        d.x += ddx * Math.min(1, 8*dt);
        d.y += ddy * Math.min(1, 8*dt);
      }
    }
    if (Math.abs(d.x - p.x) < 30 && Math.abs(d.y - p.y) < 36){
      d.got = true; gems++; Sound.gem();
      missionProg('gems', 1);
      addFloater('+1', d.x, d.y - 10, '#bfe9ff');
      for (let i=0;i<12;i++){
        const a = Math.random()*Math.PI*2, s=60+Math.random()*140;
        particles.push({ x:d.x, y:d.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.5, max:0.5,
          size:2+Math.random()*2, color:'#ffffff' });
      }
    }
  }

  // special pickups
  spawnPowerupsAhead();
  for (const u of powerups){
    if (u.got) continue;
    if (Math.abs(u.x - p.x) < 34 && Math.abs(u.y - p.y) < 40){
      u.got = true;
      applyPower(u.type);
      missionProg('power', 1);
      addFloater(POWER_LABEL[u.type], u.x, u.y - 16, POWER_STYLE[u.type].color);
      Sound.power();
      for (let i=0;i<16;i++){
        const a = Math.random()*6.28, s = 60+Math.random()*160;
        particles.push({ x:u.x, y:u.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.5, max:0.5,
          size:2+Math.random()*2.5, color:POWER_STYLE[u.type].color });
      }
    }
  }

  // aerial hoops — fly through the opening for combo points
  spawnHoopsAhead();
  for (const hp of hoops){
    if (hp.got) continue;
    if (Math.abs(hp.x - p.x) < 16 && Math.abs(hp.y - p.y) < 34){
      hp.got = true;
      const pts = 5 * combo;
      distance += pts;
      addFloater('HOOP! +' + pts, hp.x, hp.y - 44, '#ffd23d');
      addCombo();
      missionProg('hoops', 1);
      Sound.power();
      for (let i=0;i<14;i++){
        const a = Math.random()*6.28, s = 60+Math.random()*180;
        particles.push({ x:hp.x, y:hp.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.5, max:0.5,
          size:2+Math.random()*2.5, color:'#ffd23d' });
      }
    }
  }

  // spikes on the line — hop over them or crash (shield still saves you)
  spawnObstaclesAhead();
  if (POWER.invuln <= 0){
    for (const o of obstacles){
      if (o.hit) continue;
      if (Math.abs(o.x - p.x) < 15 && p.y > terrainY(p.x) - 52){
        o.hit = true;
        for (let i=0;i<14;i++){
          const a = Math.random()*6.28, s = 60+Math.random()*180;
          particles.push({ x:o.x, y:terrainY(o.x)-12, vx:Math.cos(a)*s, vy:Math.sin(a)*s-40,
            life:0.5, max:0.5, size:2+Math.random()*2, color:'#ff3b5c' });
        }
        if (POWER.shield){ shieldRescue(); }
        else { gameOver(); return; }
      }
    }
  }

  // camera follow (smooth)
  const tx = p.x - W*0.32;
  const ty = p.y - H*0.52;
  camX += (tx - camX) * Math.min(1, 8*dt);
  camY += (ty - camY) * Math.min(1, 5*dt);

  // fell way below screen (deep pit) safety net
  if (p.y - camY > H + 400){ gameOver(); return; }

  updateEffects(dt);

  // HUD
  hudScore.textContent = Math.floor(distance);
  hudGems.textContent = gems;
  let ph = '';
  if (combo > 1) ph += `<span style="color:#ffd23d">&#215;${combo}</span>`;
  if (POWER.turbo   > 0) ph += `<span style="color:#ffb14d">&#9889; ${Math.ceil(POWER.turbo)}s</span>`;
  if (POWER.lowgrav > 0) ph += `<span style="color:#c89bff">&#127769; ${Math.ceil(POWER.lowgrav)}s</span>`;
  if (POWER.magnet  > 0) ph += `<span style="color:#ff7fe3">&#129522; ${Math.ceil(POWER.magnet)}s</span>`;
  if (POWER.shield)      ph += `<span style="color:#7ff0ff">&#128737;</span>`;
  if (ph !== lastPowerHtml){ hudPowers.innerHTML = ph; lastPowerHtml = ph; }
}
let lastPowerHtml = '';

function updateEffects(dt){
  for (let i=particles.length-1;i>=0;i--){
    const q = particles[i];
    q.vy += 700*dt;
    q.x += q.vx*dt; q.y += q.vy*dt;
    q.life -= dt;
    if (q.life <= 0) particles.splice(i,1);
  }
  for (let i=floaters.length-1;i>=0;i--){
    const f = floaters[i];
    f.y -= 40*dt; f.life -= dt;
    if (f.life <= 0) floaters.splice(i,1);
  }
  if (shake > 0) shake = Math.max(0, shake - 60*dt);
}

/* ---------------------------------------------------------------- render */
function draw(){
  ctx.clearRect(0,0,W,H);

  // background gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, palette.bg1);
  g.addColorStop(1, palette.bg2);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  drawBackdrop();

  ctx.save();
  if (shake > 0){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }

  drawTerrain();
  drawObstacles();
  drawDiamonds();
  drawPowerups();
  drawHoops();
  drawLastScore();
  drawParticles();
  drawGhost();
  if (state === State.PLAYING || (state===State.OVER)) {
    // hide the bike once it has exploded
    if (state === State.PLAYING) drawVehicle();
  }
  drawFloaters();

  ctx.restore();

  drawZoneFx();
}

function drawObstacles(){
  const t = performance.now()/1000;
  for (const o of obstacles){
    if (o.hit) continue;
    const sx = o.x - camX;
    if (sx < -30 || sx > W+30) continue;
    const sy = terrainY(o.x) - camY;
    const pulse = 0.75 + 0.25*Math.sin(t*6 + o.x);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(terrainSlope(o.x));
    ctx.shadowBlur = 14; ctx.shadowColor = '#ff3b5c';
    ctx.fillStyle = '#ff3b5c'; ctx.globalAlpha = pulse;
    ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(0,-26); ctx.lineTo(9,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.globalAlpha = pulse*0.9;
    ctx.beginPath(); ctx.moveTo(-4,0); ctx.lineTo(0,-14); ctx.lineTo(4,0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawZoneFx(){
  if (state !== State.PLAYING && state !== State.OVER) return;
  const zone = zoneOf(player.x);
  if (!zone) return;
  if (zone.type === 'night'){
    // darkness closes in — only the area around the bike stays lit
    const sx = player.x - camX, sy = player.y - camY;
    const g = ctx.createRadialGradient(sx, sy, 90, sx, sy, 400);
    g.addColorStop(0, 'rgba(3,1,12,0)');
    g.addColorStop(1, 'rgba(3,1,12,0.93)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  } else {
    // storm — cold tint and the odd lightning flash
    ctx.fillStyle = 'rgba(40,60,120,0.12)';
    ctx.fillRect(0, 0, W, H);
    if (Math.random() < 0.02){
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.fillRect(0, 0, W, H);
    }
  }
}

function drawBackdrop(){
  // faint perspective grid + geometric shapes
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = palette.line;
  ctx.lineWidth = 1;
  const horizon = H*0.30 - (camY*0.04);
  // vertical converging lines
  for (let i=-10;i<=10;i++){
    const vx = W*0.5 + i * (W*0.10);
    ctx.beginPath();
    ctx.moveTo(W*0.5, horizon);
    ctx.lineTo(vx, H);
    ctx.stroke();
  }
  // horizontal lines receding
  for (let i=1;i<=8;i++){
    const yy = horizon + (H-horizon) * (i/8)*(i/8);
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke();
  }
  ctx.restore();

  // a couple of dim geometric diamonds drifting in the far background
  ctx.save();
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = palette.line;
  for (let i=0;i<5;i++){
    const bx = ((i*457 - camX*0.15) % (W+300) + W+300) % (W+300) - 150;
    const by = H*0.2 + (i*137 % (H*0.4));
    const s = 40 + (i*23)%60;
    ctx.save(); ctx.translate(bx,by); ctx.rotate(0.6);
    ctx.fillRect(-s/2,-s/2,s,s); ctx.restore();
  }
  ctx.restore();
}

function drawTerrain(){
  const step = 6;
  const startWX = camX - 40;
  const endWX = camX + W + 40;

  // split the line into solid runs separated by gaps (chasms)
  const runs = [];
  let cur = null;
  for (let wx = startWX; wx <= endWX; wx += step){
    if (inGap(wx)){ cur = null; continue; }
    if (!cur){ cur = []; runs.push(cur); }
    cur.push(wx);
  }

  const fg = ctx.createLinearGradient(0, H*0.4, 0, H);
  fg.addColorStop(0, hexA(palette.line, 0.14));
  fg.addColorStop(1, hexA(palette.line, 0.0));

  for (const run of runs){
    if (run.length < 2) continue;
    ctx.beginPath();
    for (let i = 0; i < run.length; i++){
      const sx = run[i] - camX, sy = terrainY(run[i]) - camY;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    // glow (wide, soft)
    ctx.save();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.shadowBlur = 26; ctx.shadowColor = palette.line;
    ctx.strokeStyle = palette.line2; ctx.lineWidth = 12; ctx.globalAlpha = 0.55;
    ctx.stroke();
    // bright core
    ctx.shadowBlur = 18; ctx.shadowColor = palette.line;
    ctx.strokeStyle = palette.line; ctx.lineWidth = 5; ctx.globalAlpha = 1;
    ctx.stroke();
    // white hot centre
    ctx.shadowBlur = 6;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.7;
    ctx.stroke();
    ctx.restore();

    // soft fill under this run
    ctx.save();
    ctx.lineTo(run[run.length-1] - camX, H);
    ctx.lineTo(run[0] - camX, H);
    ctx.closePath();
    ctx.fillStyle = fg;
    ctx.fill();
    ctx.restore();

    // bright end-caps where the line breaks off into a chasm
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 14; ctx.shadowColor = palette.line;
    if (run[0] > startWX + step){
      ctx.beginPath(); ctx.arc(run[0]-camX, terrainY(run[0])-camY, 3.4, 0, 6.283); ctx.fill();
    }
    if (run[run.length-1] < endWX - step){
      const wx = run[run.length-1];
      ctx.beginPath(); ctx.arc(wx-camX, terrainY(wx)-camY, 3.4, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }
}

function drawPowerups(){
  const t = performance.now()/1000;
  for (const u of powerups){
    if (u.got) continue;
    const sx = u.x - camX, sy = u.y - camY + Math.sin(t*2 + u.ph)*4;
    if (sx < -40 || sx > W+40) continue;
    const cfg = POWER_STYLE[u.type];
    ctx.save();
    ctx.translate(sx, sy);
    // glowing orb
    ctx.shadowBlur = 18; ctx.shadowColor = cfg.color;
    ctx.fillStyle = hexA(cfg.color, 0.25);
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, 6.283); ctx.fill();
    ctx.fillStyle = cfg.color;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, 6.283); ctx.fill();
    // rotating dashed ring
    ctx.save();
    ctx.rotate(t*1.5 + u.ph);
    ctx.strokeStyle = cfg.color; ctx.lineWidth = 2; ctx.setLineDash([5,6]);
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, 6.283); ctx.stroke();
    ctx.restore();
    // icon
    ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffffff';
    drawPowerIcon(u.type, cfg.color);
    ctx.restore();
  }
}

function drawHoops(){
  const t = performance.now()/1000;
  for (const hp of hoops){
    if (hp.got) continue;
    const sx = hp.x - camX, sy = hp.y - camY + Math.sin(t*2 + hp.ph)*3;
    if (sx < -30 || sx > W+30) continue;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.shadowBlur = 16; ctx.shadowColor = '#ffd23d';
    ctx.strokeStyle = '#ffd23d'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 0, 8, 32, 0, 0, 6.283); ctx.stroke();
    ctx.shadowBlur = 6;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.ellipse(0, 0, 8, 32, 0, 0, 6.283); ctx.stroke();
    ctx.restore();
  }
}

function drawPowerIcon(type, color){
  ctx.beginPath();
  if (type === 'turbo'){
    ctx.moveTo(-1.5,-7); ctx.lineTo(3.5,-1.5); ctx.lineTo(0.5,-1.5); ctx.lineTo(2,6.5);
    ctx.lineTo(-3.5,0.5); ctx.lineTo(-0.5,0.5); ctx.closePath(); ctx.fill();
  } else if (type === 'shield'){
    ctx.moveTo(0,-7);
    ctx.bezierCurveTo(4.5,-5.5, 5.5,-5, 5.5,-1.5);
    ctx.bezierCurveTo(5.5,3, 2.5,5.8, 0,7);
    ctx.bezierCurveTo(-2.5,5.8, -5.5,3, -5.5,-1.5);
    ctx.bezierCurveTo(-5.5,-5, -4.5,-5.5, 0,-7);
    ctx.closePath(); ctx.fill();
  } else if (type === 'magnet'){
    ctx.lineWidth = 3.2; ctx.lineCap = 'butt';
    ctx.arc(0,-0.5,4.6,Math.PI,0,false);
    ctx.moveTo(-4.6,-0.5); ctx.lineTo(-4.6,4.5);
    ctx.moveTo(4.6,-0.5);  ctx.lineTo(4.6,4.5);
    ctx.stroke();
    ctx.fillRect(-6.2,4.5,3.2,2.6); ctx.fillRect(3,4.5,3.2,2.6);
  } else { // lowgrav — crescent moon
    ctx.arc(0,0,6,0,6.283); ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(2.6,-1.6,4.8,0,6.283); ctx.fill();
  }
}

function drawDiamonds(){
  for (const d of diamonds){
    if (d.got) continue;
    const sx = d.x - camX;
    const sy = d.y - camY + Math.sin(performance.now()/400 + d.ph)*3;
    if (sx < -30 || sx > W+30) continue;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.shadowBlur = 16; ctx.shadowColor = '#bfe9ff';
    ctx.fillStyle = '#ffffff';
    const w = 9, h = 13;
    ctx.beginPath();
    ctx.moveTo(0,-h); ctx.lineTo(w,-h*0.15); ctx.lineTo(0,h); ctx.lineTo(-w,-h*0.15);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(150,210,255,.55)';
    ctx.beginPath(); ctx.moveTo(0,-h); ctx.lineTo(w,-h*0.15); ctx.lineTo(0,h); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawLastScore(){
  if (lastScoreX == null) return;
  const sx = lastScoreX - camX;
  if (sx < -60 || sx > W+60) return;
  const sy = terrainY(lastScoreX) - camY;
  ctx.save();
  ctx.globalAlpha = 0.9;
  // dashed hanging marker
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.setLineDash([5,5]);
  ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
  ctx.beginPath(); ctx.moveTo(sx, sy - 90); ctx.lineTo(sx, sy); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.strokeStyle = '#ffffff';
  roundRect(sx-42, sy-116, 84, 26, 6); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff'; ctx.font = '700 12px "Trebuchet MS", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('last score', sx, sy-103);
  ctx.restore();
}

function drawGhost(){
  if (!ghost || !ghost.s || ghost.s.length < 6 || state !== State.PLAYING) return;
  const n = ghost.s.length / 3;
  const f = ghostT / 0.06;
  if (f >= n - 1) return;               // the ghost's run is over
  const i = Math.floor(f), t = f - i;
  const gx = ghost.s[i*3]   * (1-t) + ghost.s[i*3+3] * t;
  const gy = ghost.s[i*3+1] * (1-t) + ghost.s[i*3+4] * t;
  const ga = ghost.s[i*3+2] * (1-t) + ghost.s[i*3+5] * t;
  const sx = gx - camX, sy = gy - camY;
  if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 60) return;
  ctx.save();
  ctx.translate(sx, sy); ctx.rotate(ga);
  ctx.globalAlpha = 0.25;
  ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff'; ctx.lineWidth = 2;
  for (const wx of [-11, 11]){ ctx.beginPath(); ctx.arc(wx, 8, 6.4, 0, 6.283); ctx.stroke(); }
  ctx.beginPath();
  ctx.moveTo(-15,6); ctx.lineTo(-9,-4); ctx.lineTo(6,-7); ctx.lineTo(15,0); ctx.lineTo(15,6);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawVehicle(){
  const p = player;
  const vc = skinColor() || palette.veh;
  const sx = p.x - camX, sy = p.y - camY;
  ctx.save();
  ctx.translate(sx, sy);
  // shield bubble / post-save blink
  if (POWER.shield || POWER.invuln > 0){
    ctx.save();
    ctx.globalAlpha = POWER.shield ? 0.55 : 0.2 + 0.35*Math.abs(Math.sin(performance.now()/90));
    ctx.strokeStyle = '#7ff0ff'; ctx.lineWidth = 2.5;
    ctx.shadowBlur = 16; ctx.shadowColor = '#35e0ff';
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, 6.283); ctx.stroke();
    ctx.restore();
  }
  ctx.rotate(p.angle);
  ctx.shadowBlur = 20; ctx.shadowColor = vc;

  // wheels
  ctx.fillStyle = '#120a1e';
  ctx.strokeStyle = vc; ctx.lineWidth = 2.4;
  for (const wx of [-11, 11]){
    ctx.beginPath(); ctx.arc(wx, 8, 6.4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
  // body
  ctx.fillStyle = vc;
  ctx.beginPath();
  ctx.moveTo(-15, 6);
  ctx.lineTo(-9, -4);
  ctx.lineTo(6, -7);
  ctx.lineTo(15, 0);
  ctx.lineTo(15, 6);
  ctx.closePath();
  ctx.fill();
  // rider
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(1, -12, 3.4, 0, Math.PI*2); ctx.fill();
  ctx.fillRect(-3, -11, 8, 6);
  ctx.restore();
}

function drawParticles(){
  for (const q of particles){
    const sx = q.x - camX, sy = q.y - camY;
    const a = Math.max(0, q.life / q.max);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.shadowBlur = 10; ctx.shadowColor = q.color;
    ctx.fillStyle = q.color;
    ctx.fillRect(sx - q.size/2, sy - q.size/2, q.size, q.size);
    ctx.restore();
  }
}

function drawFloaters(){
  for (const f of floaters){
    const sx = f.x - camX, sy = f.y - camY;
    const a = Math.min(1, f.life);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = '900 34px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowBlur = 18; ctx.shadowColor = f.color;
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, sx, sy);
    ctx.restore();
  }
}

/* ---------------------------------------------------------------- utils */
function hexA(hex, a){
  const h = hex.replace('#','');
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------------------------------------------------------------- loop */
const hud = document.getElementById('hud');
const loadScreen = document.getElementById('loadScreen');
const menuScreen = document.getElementById('menuScreen');
const overScreen = document.getElementById('overScreen');
const hudScore = document.getElementById('hudScore');
const hudGems = document.getElementById('hudGems');
const hudTitle = document.getElementById('hudTitle');
const hudPowers = document.getElementById('hudPowers');
const menuStats = document.getElementById('menuStats');
const overStats = document.getElementById('overStats');
const menuMissions = document.getElementById('menuMissions');
const garageScreen = document.getElementById('garageScreen');
const garageWallet = document.getElementById('garageWallet');
const skinGrid = document.getElementById('skinGrid');

let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;   // clamp big gaps (tab switches)
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
